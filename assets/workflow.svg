<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 224" width="1180" height="224" role="img" aria-label="How the agent works: scan, classify, plan, implement Tier 1 first, verify across poses">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#bfc0c0"/>
    </marker>
  </defs>
  <style>
    .sans{font-family:'Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace}
    .serif{font-family:'Instrument Serif',ui-serif,Georgia,serif}
    .eyebrow{font-size:8px;font-weight:500;letter-spacing:.18em;fill:#7a8399}
    .step{font-size:13px;font-weight:600;fill:#2d3142}
    .body{font-size:10.5px;fill:#4f5d75}
    .tag{font-size:8.5px;fill:#2e5aa8}
    .num{font-size:8px;font-weight:500;letter-spacing:.16em;fill:#7a8399}
    .callout{font-size:13px;font-style:italic;fill:#4f5d75}
  </style>
  <rect width="1180" height="224" fill="#f5f5f5"/>
  <text class="mono eyebrow" x="36" y="32">WHAT THE AGENT ACTUALLY DOES</text>
  <line x1="36" y1="44" x2="1144" y2="44" stroke="#bfc0c0"/>

  <g transform="translate(36 66)">
    <rect width="192" height="92" rx="8" fill="#ececec"/>
    <text class="mono num" x="16" y="24">01</text>
    <text class="sans step" x="16" y="46">Scan</text>
    <text class="sans body" x="16" y="64">Grep for Duo-hostile</text><text class="sans body" x="16" y="77">patterns, ranked P0–P2.</text>
  </g>
  <path d="M236 112 H258" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#a)"/>
  <g transform="translate(266 66)">
    <rect width="192" height="92" rx="8" fill="#ececec"/>
    <text class="mono num" x="16" y="24">02</text>
    <text class="sans step" x="16" y="46">Classify</text>
    <text class="sans body" x="16" y="64">Each finding gets a</text><text class="sans body" x="16" y="77">tier and a severity.</text>
  </g>
  <path d="M466 112 H488" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#a)"/>
  <g transform="translate(496 66)">
    <rect width="192" height="92" rx="8" fill="#ececec"/>
    <text class="mono num" x="16" y="24">03</text>
    <text class="sans step" x="16" y="46">Plan</text>
    <text class="sans body" x="16" y="64">Smallest coherent</text><text class="sans body" x="16" y="77">batches, in order.</text>
  </g>
  <path d="M696 112 H718" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- focal step -->
  <g transform="translate(726 66)">
    <rect width="192" height="92" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text style="fill:#eb6c36" class="mono num" x="16" y="24">04</text>
    <text class="sans step" x="16" y="46">Implement</text>
    <text class="sans body" x="16" y="64">Tier 1 to green before</text><text class="sans body" x="16" y="77">any Duo-only API.</text>
  </g>
  <path d="M926 112 H948" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#a)"/>
  <g transform="translate(956 66)">
    <rect width="188" height="92" rx="8" fill="#ececec"/>
    <text class="mono num" x="16" y="24">05</text>
    <text class="sans step" x="16" y="46">Verify</text>
    <text class="sans body" x="16" y="64">Every pose, plus the</text><text class="sans body" x="16" y="77">widths in between.</text>
  </g>

  <text class="serif callout" x="36" y="196">Unverifiable SDK symbols are reported as SDK-blocked, never invented — enforced by a manifest, not a promise.</text>
</svg>
