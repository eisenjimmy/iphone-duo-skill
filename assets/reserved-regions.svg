<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="The three iPhone Duo reserved regions — outer camera occlusion, inner camera occlusion, and the folding division region">
  <defs>
    <pattern id="fold" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="rgba(235,108,54,0.08)"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#eb6c36" stroke-width="1.6" stroke-opacity=".5"/>
    </pattern>
    <marker id="tick" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/>
    </marker>
  </defs>
  <style>
    .sans{font-family:'Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace}
    .serif{font-family:'Instrument Serif',ui-serif,Georgia,serif}
    .eyebrow{font-size:8px;font-weight:500;letter-spacing:.18em}
    .name{font-size:13px;font-weight:600;fill:#2d3142}
    .body{font-size:11px;fill:#4f5d75}
    .code{font-size:9px;fill:#2e5aa8}
    .callout{font-size:14px;font-style:italic;fill:#4f5d75}
    .screen{fill:#ffffff;stroke:#2d3142;stroke-width:1.4;stroke-linejoin:round}
    .card{fill:#ececec;stroke:none}
    .cell{fill:#4f5d75;opacity:.18}
  </style>
  <rect width="1180" height="430" fill="#f5f5f5"/>
  <text style="fill:#7a8399" class="mono eyebrow" x="36" y="34">RESERVED REGIONS · WHAT THE SYSTEM CARVES OUT OF YOUR CANVAS</text>
  <line x1="36" y1="46" x2="1144" y2="46" stroke="#bfc0c0"/>

  <!-- A outer camera -->
  <g transform="translate(36 68)">
    <rect width="348" height="286" rx="8" class="card"/>
    <text style="fill:#7a8399" class="mono eyebrow" x="20" y="28">OCCLUSION · ALWAYS ACTIVE</text>
    <text class="sans name" x="20" y="48">Outer front camera</text>
    <g transform="translate(174 152)">
      <rect x="-48" y="-80" width="96" height="160" rx="9" class="screen"/>
      <rect x="-43" y="-74" width="14" height="148" rx="5" fill="#2d3142" opacity=".07"/>
      <circle cx="-36" cy="-54" r="3" fill="#4f5d75"/><circle cx="-36" cy="-42" r="3" fill="#7a8399"/><circle cx="-36" cy="-30" r="3" fill="#7a8399"/>
      <rect x="-45" y="-78" width="19" height="8" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
      <g class="cell"><rect x="-22" y="-54" width="62" height="9" rx="4.5"/><rect x="-22" y="-40" width="48" height="9" rx="4.5"/><rect x="-22" y="-26" width="56" height="9" rx="4.5"/><rect x="-22" y="-12" width="40" height="9" rx="4.5"/></g>
      <line x1="-26" y1="-74" x2="8" y2="-96" stroke="#eb6c36" stroke-width="1.1" marker-end="url(#tick)"/>
    </g>
    <text class="sans body" x="20" y="248">Aligned with the side controls. Expands into</text>
    <text class="sans body" x="20" y="263">the Dynamic Island for Live Activities.</text>
    <text class="mono code" x="20" y="278">reservedRegions(kind: .occlusion)</text>
  </g>

  <!-- B inner camera -->
  <g transform="translate(412 68)">
    <rect width="348" height="286" rx="8" class="card"/>
    <text style="fill:#7a8399" class="mono eyebrow" x="20" y="28">OCCLUSION · ONLY WHILE ACTIVE</text>
    <text class="sans name" x="20" y="48">Inner front camera</text>
    <g transform="translate(174 152)">
      <rect x="-80" y="-66" width="160" height="132" rx="9" class="screen"/>
      <line x1="0" y1="-66" x2="0" y2="66" stroke="#bfc0c0" stroke-width="1"/>
      <circle cx="0" cy="-52" r="6.5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
      <g class="cell"><rect x="-70" y="-34" width="62" height="30" rx="5"/><rect x="8" y="-34" width="62" height="30" rx="5"/><rect x="-70" y="4" width="62" height="30" rx="5"/><rect x="8" y="4" width="62" height="30" rx="5"/></g>
    </g>
    <text class="sans body" x="20" y="248">Invisible until a capture session starts — then</text>
    <text class="sans body" x="20" y="263">the UI moves aside. Your geometry changes.</text>
    <text class="mono code" x="20" y="278">re-read after session start</text>
  </g>

  <!-- C fold — the focal panel -->
  <g transform="translate(788 68)">
    <rect width="356" height="286" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text style="fill:#eb6c36" class="mono eyebrow" x="20" y="28">DIVISION · WHEN PARTIALLY OPEN</text>
    <text class="sans name" x="20" y="48">The folding region</text>
    <g transform="translate(178 152)">
      <rect x="-84" y="-66" width="168" height="132" rx="9" class="screen"/>
      <rect x="-11" y="-66" width="22" height="132" fill="url(#fold)"/>
      <line x1="-11" y1="-66" x2="-11" y2="66" stroke="#eb6c36" stroke-width="1.4"/>
      <line x1="11" y1="-66" x2="11" y2="66" stroke="#eb6c36" stroke-width="1.4"/>
      <g class="cell"><rect x="-74" y="-46" width="58" height="40" rx="5"/><rect x="16" y="-46" width="58" height="40" rx="5"/><rect x="-74" y="2" width="58" height="40" rx="5"/><rect x="16" y="2" width="58" height="40" rx="5"/></g>
    </g>
    <text class="sans body" x="20" y="248">Zero width when flat — still worth querying. An</text>
    <text class="sans body" x="20" y="263">inactive fold is why grids want EVEN columns.</text>
    <text class="mono code" x="20" y="278">.division · options: .includeInactive</text>
  </g>

  <line x1="36" y1="380" x2="1144" y2="380" stroke="#bfc0c0"/>
  <text class="serif callout" x="36" y="406">Occlusion covers. Division splits. Treating one as the other is the most common iPhone Duo layout bug.</text>
</svg>
